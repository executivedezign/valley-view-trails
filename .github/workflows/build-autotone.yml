name: Build autotone.exe

on:
  push:
    paths:
      - "tools/autotone/**"
      - ".github/workflows/build-autotone.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyinstaller -r tools/autotone/requirements.txt

      - name: Smoke test analysis core
        run: |
          python -c "from PIL import Image; Image.new('RGB', (64, 64), (30, 30, 60)).save('smoke.jpg')"
          python tools/autotone/autotone.py smoke.jpg --report

      - name: Build windowed executable
        working-directory: tools/autotone
        run: pyinstaller --onefile --windowed --name autotone autotone_gui.py

      - name: Smoke test frozen exe (launches and stays alive)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath tools\autotone\dist\autotone.exe -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "autotone.exe exited early with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id

      - uses: actions/upload-artifact@v4
        with:
          name: autotone-windows
          path: tools/autotone/dist/autotone.exe

      - name: Publish to the autotone release (stable download link)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view autotone 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create autotone --title "autotone (latest build)" `
              --notes "Windows app that analyzes JPEGs and embeds per-image Lightroom corrections. Always the latest build. Download autotone.exe below."
          }
          gh release upload autotone tools/autotone/dist/autotone.exe --clobber
